name: Build Android APK

on:
  push:
    tags:
      - 'v*'  # Triggers on tags starting with 'v' (e.g., v1.0, 
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with the APK'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug & Release APKs
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APKs for Distribution
        id: prepare_apks
        run: |
          mkdir -p dist
          shopt -s nullglob

          # 1. Copy Debug APKs
          debug_apks=(android/app/build/outputs/apk/debug/*.apk)
          for apk in "${debug_apks[@]}"; do
            filename=$(basename "$apk")
            # Extract ABI tag if present (e.g., app-arm64-v8a-debug.apk -> arm64-v8a)
            abi=$(echo "$filename" | sed -E 's/^app(-([a-zA-Z0-9_-]+))?-debug\.apk$/\2/')
            if [ -n "$abi" ]; then
              cp "$apk" "dist/KoboldAI-Lite-${abi}-debug.apk"
            else
              cp "$apk" "dist/KoboldAI-Lite-debug.apk"
            fi
          done

          # 2. Process & Sign Release APKs
          unsigned_apks=(android/app/build/outputs/apk/release/*-unsigned.apk)
          if [ ${#unsigned_apks[@]} -gt 0 ]; then
            # Generate temporary keystore for signing
            keytool -genkeypair -v \
              -keystore dist.keystore \
              -alias koboldkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass koboldai \
              -keypass koboldai \
              -dname "CN=KoboldAILite, OU=Mobile, O=KoboldAI, L=Global, S=Global, C=US"

            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

            for apk in "${unsigned_apks[@]}"; do
              filename=$(basename "$apk")
              abi=$(echo "$filename" | sed -E 's/^app(-([a-zA-Z0-9_-]+))?-release-unsigned\.apk$/\2/')
              if [ -n "$abi" ]; then
                outname="KoboldAI-Lite-${abi}-release.apk"
              else
                outname="KoboldAI-Lite-release.apk"
              fi

              echo "Signing $filename -> dist/$outname"
              $APKSIGNER sign \
                --ks dist.keystore \
                --ks-pass pass:koboldai \
                --key-pass pass:koboldai \
                --out "dist/$outname" \
                "$apk"
            done
          else
            # If release APKs were already signed by Gradle
            release_apks=(android/app/build/outputs/apk/release/*.apk)
            for apk in "${release_apks[@]}"; do
              filename=$(basename "$apk")
              abi=$(echo "$filename" | sed -E 's/^app(-([a-zA-Z0-9_-]+))?-release\.apk$/\2/')
              if [ -n "$abi" ]; then
                cp "$apk" "dist/KoboldAI-Lite-${abi}-release.apk"
              else
                cp "$apk" "dist/KoboldAI-Lite-release.apk"
              fi
            done
          fi

          echo "Listing all generated APKs in dist/:"
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KoboldAI-Lite-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('KoboldAI Lite {0}', github.sha) }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
