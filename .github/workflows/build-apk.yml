name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with the APK'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug & Release APK
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APKs for Distribution
        id: prepare_apks
        run: |
          mkdir -p dist
          
          # Copy debug APK (already signed by Android debug key)
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/KoboldAI-Lite-debug.apk
          fi

          # Sign release APK with debug keystore so it can be directly installed if no custom keystore is configured
          RELEASE_UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "$RELEASE_UNSIGNED" ]; then
            # Generate a distribution keystore for signing release APK
            keytool -genkeypair -v \
              -keystore dist.keystore \
              -alias koboldkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass koboldai \
              -keypass koboldai \
              -dname "CN=KoboldAILite, OU=Mobile, O=KoboldAI, L=Global, S=Global, C=US"

            # Find apksigner
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
            $APKSIGNER sign \
              --ks dist.keystore \
              --ks-pass pass:koboldai \
              --key-pass pass:koboldai \
              --out dist/KoboldAI-Lite-release.apk \
              "$RELEASE_UNSIGNED"
            
            cp "$RELEASE_UNSIGNED" dist/KoboldAI-Lite-release-unsigned.apk
          fi

          echo "Listing generated APKs in dist/:"
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KoboldAI-Lite-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('KoboldAI Lite {0}', github.sha) }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
